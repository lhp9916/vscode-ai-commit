name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 准备 Linux 虚拟显示
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: 编译
        run: npm run compile

      - name: 运行单元测试
        run: npm test

      - name: 运行 Lint
        run: npm run lint

      # 用 xvfb 启动扩展宿主，验证 Git 采集与提交框回填的完整链路。
      - name: 运行集成测试
        run: xvfb-run -a npm run test:integration

      - name: 打包 VSIX
        run: npm run package -- --allow-missing-repository

      - name: 上传 VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-ai-commit-vsix
          path: "*.vsix"
          if-no-files-found: error
