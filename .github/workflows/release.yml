name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: 发布版本
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 准备 Linux 虚拟显示
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # tag 是版本号的唯一来源，避免 package.json 与发布版本不一致。
      - name: 解析版本号
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "无法从 tag '${GITHUB_REF_NAME}' 解析版本号" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "解析到版本号：$VERSION"

      - name: 写入版本号
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: 编译与测试
        run: npm run compile && npm test

      - name: 运行 Lint
        run: npm run lint

      - name: 运行集成测试
        run: xvfb-run -a npm run test:integration

      - name: 打包 VSIX
        run: npm run package

      - name: 校验产物
        run: |
          EXPECTED="vscode-ai-commit-${{ steps.version.outputs.version }}.vsix"
          test -f "$EXPECTED" || {
            echo "未找到预期产物 $EXPECTED，实际内容：" >&2
            ls -l *.vsix >&2
            exit 1
          }
          echo "产物确认：$EXPECTED"

      - name: 创建 GitHub Release 并上传 VSIX
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: vscode-ai-commit-*.vsix
          fail_on_unmatched_files: true
